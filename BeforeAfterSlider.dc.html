<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <script src="./image-slot.js"></script>
  <style>
    image-slot::part(empty){ justify-content:flex-start; padding-top:12px; gap:4px }
    image-slot::part(empty) svg{ width:22px; height:22px }
  </style>
</helmet>
<div ref="{{ containerRef }}" style="position:relative;aspect-ratio:4/3;overflow:hidden;background:#EDEDED">
  <div style="position:absolute;inset:0">
    <image-slot id="{{ afterId }}" shape="rect" placeholder="After photo" src="{{ afterSrc }}"></image-slot>
  </div>
  <div style="position:absolute;top:0;left:0;bottom:0;width:{{ posPct }}%;overflow:hidden">
    <div style="position:absolute;top:0;left:0;bottom:0;width:{{ beforeInnerPct }}%">
      <image-slot id="{{ beforeId }}" shape="rect" placeholder="Before photo" src="{{ beforeSrc }}"></image-slot>
    </div>
  </div>
  <div style="position:absolute;top:0;bottom:0;left:{{ posPct }}%;width:2px;background:#fff;transform:translateX(-50%);pointer-events:none;box-shadow:0 0 6px rgba(0,0,0,.5);z-index:2"></div>
  <div onMouseDown="{{ onDown }}" onTouchStart="{{ onDown }}" style="position:absolute;top:50%;left:{{ posPct }}%;transform:translate(-50%,-50%);width:52px;height:52px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 10px rgba(0,0,0,.35);cursor:ew-resize;pointer-events:auto;z-index:3">
    <span style="font:700 15px Arial,sans-serif;color:#03334D;letter-spacing:2px">&#10094;&#10095;</span>
  </div>
  <div style="position:absolute;left:14px;bottom:14px;background:#fff;padding:8px 18px;font:700 15px 'Roboto',sans-serif;color:#03334D;pointer-events:none;z-index:2">Before</div>
  <div style="position:absolute;right:14px;bottom:14px;background:#fff;padding:8px 18px;font:700 15px 'Roboto',sans-serif;color:#03334D;pointer-events:none;z-index:2">After</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:400,&quot;height&quot;:300},&quot;slotId&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;service&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;beforeSrc&quot;:{&quot;editor&quot;:null,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;afterSrc&quot;:{&quot;editor&quot;:null,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { pos: 50 };
  containerRef = React.createRef();

  onDown = (e) => {
    e.preventDefault();
    window.addEventListener('mousemove', this.onMove);
    window.addEventListener('mouseup', this.onUp);
    window.addEventListener('touchmove', this.onMove, { passive: false });
    window.addEventListener('touchend', this.onUp);
  };
  onMove = (e) => {
    if (!this.containerRef.current) return;
    const rect = this.containerRef.current.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    let pct = ((clientX - rect.left) / rect.width) * 100;
    pct = Math.max(0, Math.min(100, pct));
    this.setState({ pos: pct });
    if (e.touches) e.preventDefault();
  };
  onUp = () => {
    window.removeEventListener('mousemove', this.onMove);
    window.removeEventListener('mouseup', this.onUp);
    window.removeEventListener('touchmove', this.onMove);
    window.removeEventListener('touchend', this.onUp);
  };
  componentWillUnmount() { this.onUp(); }

  renderVals() {
    const baseId = this.props.slotId || 'slider';
    const pos = this.state.pos;
    return {
      containerRef: this.containerRef,
      onDown: this.onDown,
      posPct: pos,
      beforeInnerPct: 100 / Math.max(pos, 0.1) * 100,
      beforeId: baseId + '-before',
      afterId: baseId + '-after',
      beforeSrc: this.props.beforeSrc || '',
      afterSrc: this.props.afterSrc || ''
    };
  }
}
</script>
</body>
</html>
